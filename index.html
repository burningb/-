<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>함께하는 기록</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: one dark exhibition room — a thin top rail (title + three chapters), the stage fills the rest, one caption line under it. */
:root{
  --ground:#0d0b0f;      /* gallery dark, a little plum */
  --ground-2:#17141a;
  --ink:#efe8dc;         /* oil-pastel white */
  --muted:#9a909e;
  --rule:#2b2630;
  --red:#e3221b;         /* the horizon band in 질주 */
  --display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding-block:14px 10px;border-bottom:1px solid var(--rule)}
h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-wrap:balance}
h1 small{font-family:var(--ui);font-weight:400;font-size:12px;color:var(--muted);margin-left:10px;letter-spacing:.04em}
nav{display:flex;gap:4px;margin-left:auto}
nav button{font:inherit;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px 5px;cursor:pointer;display:flex;gap:7px;align-items:baseline}
nav button b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink);opacity:.55}
nav button span{font-size:11px;letter-spacing:.08em}
nav button[aria-current="true"]{border-bottom-color:var(--red)}
nav button[aria-current="true"] b{opacity:1}
nav button:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{position:relative;min-height:0;overflow:hidden}
.scene{position:absolute;inset:0}
.cap{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;padding-block:10px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);min-height:44px}
.cap p{margin:0;font-family:var(--display);font-size:15px;min-width:0}
.cap .meta{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:13px;color:var(--ground);background:var(--ink);border:0;border-radius:2px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
/* intro */
.intro{position:absolute;inset:0;z-index:20;background:var(--ground);display:grid;place-items:center;text-align:center;padding:24px}
.intro .in{max-width:34rem;display:grid;gap:18px;justify-items:center}
.intro h2{font-family:var(--display);font-size:clamp(34px,7vw,64px);margin:0;line-height:1.1;font-weight:700}
.intro p{margin:0;color:var(--muted);line-height:1.75;font-size:14px}
.intro .band{width:min(420px,80%);height:10px;background:var(--red);opacity:.9}
.intro img{height:78px;width:auto}
/* scene 1: score */
.s1{display:grid;place-items:center;perspective:1200px;perspective-origin:50% 32%}
.paper{position:relative;aspect-ratio:1440/1164;height:min(86%,calc((100vw - 32px)*1164/1440));max-width:100%;transform-style:preserve-3d;will-change:transform;margin-bottom:6%}
.grid{transform-style:preserve-3d}
.floor{position:absolute;left:-60%;right:-60%;top:100%;height:120%;transform-origin:50% 0;transform:rotateX(90deg);pointer-events:none;
  background:radial-gradient(ellipse 14% 22% at var(--sx,30%) 4%,rgba(255,226,180,.22),transparent 70%),radial-gradient(ellipse 40% 30% at 50% 0%,rgba(140,120,160,.10),transparent 70%),linear-gradient(180deg,#1c1820,#0d0b0f 60%)}
.paper .base{position:absolute;inset:0;background:url(score.jpg) center/100% 100%;filter:brightness(.22) saturate(.6)}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(7,1fr)}
.cell{touch-action:manipulation;position:relative;border:0;padding:0;margin:0;background:url(score.jpg) 0 0/800% 700%;opacity:0;cursor:pointer;transition:opacity .9s ease,filter .9s ease}
.cell:hover{opacity:.35}
.cell.seen{opacity:.62;filter:saturate(.8);transform:translateZ(10px)}
.cell.on{opacity:1;filter:saturate(1.15) brightness(calc(1 + var(--amp,0)*.6));z-index:2;transform:translateZ(calc(42px + var(--amp,0)*46px)) scale(calc(1.04 + var(--amp,0)*.06));box-shadow:0 22px 34px rgba(0,0,0,.65),0 0 calc(10px + var(--amp,0)*40px) rgba(255,240,210,.35);transition:opacity .15s,filter .05s,transform .08s}
.fig{position:absolute;height:clamp(48px,9vh,78px);width:auto;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6))}
.s1 .fig{bottom:-6px;transition:left 1.1s cubic-bezier(.45,.1,.2,1)}
.s1 .fig.hop{animation:hop .5s ease}
@keyframes hop{40%{transform:translateY(-10px)}}
/* scene 2 & 3 */
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tooth{mix-blend-mode:multiply;pointer-events:none}
.s2{overflow:hidden;background:radial-gradient(ellipse 80% 40% at 50% 0%,#1d1922,transparent 70%),var(--ground)}
.floor2{position:absolute;inset:0;will-change:transform;transform-origin:50% 60%}
.endcard{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(13,11,15,.82);border:1px solid var(--rule);padding:12px 16px;z-index:4;width:max-content;max-width:calc(100% - 32px);flex-wrap:wrap}
.endcard p{margin:0;font-family:var(--display);font-size:15px}
.s3{display:grid;place-items:center}
.voy{position:relative;width:100%;aspect-ratio:1346/490;max-height:100%;perspective:900px;overflow:hidden}
.cam{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.lay{position:absolute;inset:0}
.farL{transform:translateZ(-90px) scale(1.1)}
.midL{transform:translateZ(-30px) scale(1.034)}
.nearL{transform:translateZ(36px) scale(.96)}
.nearL img.paint{-webkit-mask-image:linear-gradient(180deg,transparent 57%,#000 64%);mask-image:linear-gradient(180deg,transparent 57%,#000 64%)}
.voy img.paint{position:absolute;inset:0;width:100%;height:100%;filter:brightness(var(--lit,.35)) saturate(calc(.6 + var(--lit,.35)*.5));transition:filter 1.2s ease}
.voy .fig{left:26.5%;bottom:39%;height:clamp(34px,7vw,74px);transform-origin:50% 100%}
.voy .fig.row{animation:row .7s ease}
@keyframes row{30%{transform:rotate(-7deg) translateY(-3px)}70%{transform:rotate(4deg)}}
.dash{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;z-index:3}
.track{width:min(360px,60vw);height:3px;background:var(--rule);position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:var(--red);width:0;transition:width .6s}
.big{font-family:var(--display);font-size:clamp(22px,4vw,34px);font-variant-numeric:tabular-nums}
.cellist{position:absolute;height:clamp(64px,12vh,104px);aspect-ratio:185/300;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.cellist>*{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cellist .h1{clip-path:inset(38% 77% 49% 0)}
.cellist .h2{clip-path:inset(40% 8% 45% 70%)}
.cellist .bowmove{transform:translate(calc(var(--bw,0)*-26px),calc(var(--bw,0)*13.7px));transform-box:view-box}
.cellist{transform:scaleX(var(--fx,1))}
.cellist.flip{--fx:-1}

.player{position:absolute;width:auto;pointer-events:none;transform-origin:50% 100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.player.flip{--fx:-1}
.s1 .player{bottom:0;height:clamp(66px,14vh,118px);transform:translateZ(70px) scaleX(var(--fx,1)) rotate(calc(var(--bw,0)*2.5deg));transition:left 1.1s cubic-bezier(.45,.1,.2,1)}
.rc{position:absolute;left:0;top:0;transform-origin:50% 80%;width:clamp(64px,9vw,124px);height:auto;pointer-events:none;z-index:3;filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 8px rgba(255,255,255,.25)) drop-shadow(0 6px 6px rgba(0,0,0,.6))}
.voy .solo{left:50%;bottom:29%;height:clamp(52px,13.5vw,162px);margin-left:calc(clamp(52px,13.5vw,162px)*-.36);opacity:0;transition:opacity 2.4s ease;z-index:2;transform:rotate(calc(var(--bw,0)*2.5deg))}
.voy.finale .solo{opacity:1}
.voy .fig{transition:opacity 1.6s ease}
.voy.finale #fig3{opacity:0}
.preview{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (max-width:640px){
  h1 small{display:none}
  nav{margin-left:0;width:100%;justify-content:space-between}
  nav button{padding:6px 4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>함께하는 기록<small>김종훈 · 소리와 선과 바퀴</small></h1>
    <nav aria-label="장">
      <button id="nav1" data-s="1" aria-current="true"><b>진동</b><span>01</span></button>
      <button id="nav2" data-s="2"><b>흐름</b><span>02</span></button>
      <button id="nav3" data-s="3"><b>항해</b><span>03</span></button>
    </nav>
  </header>

  <main id="stage">
    <section class="scene s1" id="s1" aria-label="진동">
      <div class="paper" id="paper">
        <div class="base"></div>
        <div class="grid" id="grid"></div>
        <div class="floor" id="floor"></div>
      </div>
    </section>

    <section class="scene s2" id="s2" aria-label="흐름" hidden>
      <div class="floor2" id="floor2">
        <canvas id="paint"></canvas>
        <canvas id="tooth" class="tooth"></canvas>
      </div>
      <img class="rc" id="fig2" src="f_rcride.webp" alt="지휘자 피규어가 올라탄 RC카">
      <div class="endcard" id="end2" hidden>
        <p>한 번의 연주가 한 장의 그림이 되었습니다.</p>
        <button class="btn" id="again2">처음부터 다시 그리기</button>
      </div>
    </section>

    <section class="scene s3" id="s3" aria-label="항해" hidden>
      <div class="voy" id="voy">
        <div class="cam" id="cam">
          <div class="lay farL"><img class="paint" src="opera.jpg" alt="김종훈, 시드니 오페라하우스를 그린 대형 회화"></div>
          <div class="lay midL" id="midL"><canvas id="orch"></canvas></div>
          <div class="lay nearL"><img class="paint" src="opera.jpg" alt=""><canvas id="wake"></canvas><img class="fig" id="fig3" src="f_conductor.webp" alt="첼로 배 위에서 지휘하는 피규어"></div>
        </div>
      </div>
      <div class="dash">
        <button class="btn" id="row">노 젓기</button>
        <div class="track" aria-hidden="true"><i id="bar"></i></div>
        <button class="preview" id="peek" hidden>도착 장면 미리 보기</button>
      </div>
    </section>

    <div class="intro" id="intro">
      <div class="in">
        <img src="f_conductor.webp" alt="" class="introfig">
        <h2>함께하는 기록</h2>
        <div class="band"></div>
        <p>김종훈 작가의 첼로 소리와 그림으로 함께 만드는 기록입니다. 칸을 깨우고, 선을 긋고, 함께 노를 저어 주세요.</p>
        <button class="btn" id="start">소리 켜고 시작</button>
        <p id="load" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <div class="cap">
    <p id="capText">칸을 눌러 보세요. 칸마다 첼로의 낮은 소리가 하나씩 들어 있습니다.</p>
    <span class="meta" id="capMeta"></span>
  </div>
</div>

<script>
(()=>{

const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let S=null, AC=null, master, analyser, abuf=new Float32Array(1024), bufs={};
let scene=1;
const look={x:0,y:0,tx:0,ty:0,last:-1e9};
document.getElementById('stage').addEventListener('pointermove',e=>{ const r=e.currentTarget.getBoundingClientRect();
  look.tx=((e.clientX-r.left)/r.width-.5)*2; look.ty=((e.clientY-r.top)/r.height-.5)*2; look.last=performance.now(); });
function stepLook(){ const now=performance.now();
  if(now-look.last>3000){ look.tx=Math.sin(now/5200)*.45; look.ty=Math.sin(now/7300)*.3; }
  const k=RM?1:.06; look.x+=(look.tx-look.x)*k; look.y+=(look.ty-look.y)*k; if(RM){look.x=look.y=0;} }

/* ---------- audio ---------- */
// Audio must be switched on inside the tap itself (iOS keeps it locked otherwise).
function openAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  master=AC.createGain(); analyser=AC.createAnalyser(); analyser.fftSize=1024;
  master.connect(analyser); analyser.connect(AC.destination);
  const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);
  AC.resume?.();
}
function wakeAudio(){ if(AC&&AC.state!=='running') AC.resume?.(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) wakeAudio(); });
const get=async n=>{ const ab=await (await fetch(''+n)).arrayBuffer(); return await new Promise((ok,no)=>{ const p=AC.decodeAudioData(ab,ok,no); if(p&&p.then) p.then(ok,no); }); };
let c2Ready=null;
async function loadAll(){
  $('load').textContent='소리를 불러오는 중…';
  S=await (await fetch('sound.json')).json();
  bufs.c1=await get('cells.mp3');                 // chapter 1 only needs its 56 short clips
  c2Ready=get('cello2.mp3').then(b=>bufs.c2=b);  // the rest keeps loading in the background
}
async function needC2(){ if(bufs.c2) return true; $('capMeta').textContent='소리를 불러오는 중…'; try{ await c2Ready; return true; }catch(e){ $('capMeta').textContent='소리를 불러오지 못했습니다. 새로 고쳐 주세요.'; return false; } }
function amp(){ if(!analyser) return 0; analyser.getFloatTimeDomainData(abuf); let s=0; for(const v of abuf) s+=v*v; return Math.min(1,Math.sqrt(s/abuf.length)*7); }
let oneShot=null;
function playSeg(buf,t0,t1,fade=.5){
  wakeAudio(); if(oneShot){ try{oneShot.g.gain.setTargetAtTime(0,AC.currentTime,.04); oneShot.s.stop(AC.currentTime+.2);}catch(e){} }
  const s=AC.createBufferSource(), g=AC.createGain(); s.buffer=buf; s.connect(g); g.connect(master);
  const d=Math.max(.4,t1-t0), n=AC.currentTime;
  g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(1,n+.012);
  g.gain.setValueAtTime(1,n+Math.max(.1,d-fade)); g.gain.linearRampToValueAtTime(0,n+d);
  s.start(n,t0,d+.05); oneShot={s,g}; return d;
}
let stream=null;
function playStream(buf,offset=0){
  wakeAudio(); stopStream(); if(!buf) return; const s=AC.createBufferSource(); s.buffer=buf; s.connect(master);
  s.start(AC.currentTime,offset); stream={s,t0:AC.currentTime-offset,dur:buf.duration,done:false};
  s.onended=()=>{ if(stream&&stream.s===s) stream.done=true; };
}
function stopStream(){ if(stream){ try{stream.s.onended=null; stream.s.stop();}catch(e){} stream=null; } }
const streamT=()=>stream?Math.min(stream.dur,AC.currentTime-stream.t0):0;

/* ---------- colour, from his paintings ---------- */
const P={black:[13,11,17],plum:[56,18,50],dred:[148,15,18],red:[222,30,24],orange:[245,118,24],yellow:[247,210,40],lime:[168,216,64],green:[24,120,66],cobalt:[26,52,178],sky:[58,174,236],pink:[242,108,166],violet:[98,52,156],white:[242,236,220],ochre:[208,148,52]};
const LADDER=[[50,'dred'],[54,'orange'],[57,'yellow'],[58.7,'lime'],[59.7,'green'],[60.6,'red'],[61.6,'cobalt'],[62.6,'ochre'],[64,'pink'],[66,'violet'],[69,'sky'],[99,'white']];
const NEIGH={dred:'orange',orange:'cobalt',yellow:'violet',lime:'plum',green:'pink',red:'sky',cobalt:'yellow',ochre:'cobalt',pink:'green',violet:'lime',sky:'red',white:'black',black:'plum',plum:'black'};
let seed=23; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const pickC=(m,l)=>{ if(l<.45) return rnd()<.7?'black':'plum'; for(const [lim,c] of LADDER) if(m<lim) return c; return 'white'; };
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const hash=(n)=>{const x=Math.sin(n*127.1)*43758.5453; return x-Math.floor(x);};
const vnoise=(x,ph)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f); return hash(i+ph)*(1-u)+hash(i+1+ph)*u;};

/* ---------- 01 진동 ---------- */
const grid=$('grid'); let woke=new Set(), litCell=null, bow1=null;
const fig1=document.createElement('img'); fig1.className='player'; fig1.src='f_cello.webp'; fig1.alt='첼로를 켜는 김종훈 피규어'; fig1.style.left='2%'; $('paper').appendChild(fig1);
for(let i=0;i<56;i++){
  const b=document.createElement('button'); b.className='cell'; b.id='cell'+i;
  const c=i%8, r=Math.floor(i/8); b.style.backgroundPosition=`${c/7*100}% ${r/6*100}%`;
  b.setAttribute('aria-label',`${r+1}행 ${c+1}열 칸`); b.dataset.i=i; grid.appendChild(b);
}
function wakeCell(e){
  const b=e.target.closest('.cell'); if(!b||!S||!bufs.c1) return; const i=+b.dataset.i, c=i%8;
  const cell=S.c1.cells[i]; const d=playSeg(bufs.c1,cell[0],cell[1],.8);
  if(litCell) litCell.classList.replace('on','seen');
  b.classList.add('on'); litCell=b; woke.add(i);
  const x=(c+.5)/8*100, cur=parseFloat(fig1.dataset.x||'4'), right=x>cur+2; fig1.dataset.x=x;
  fig1.classList.toggle('flip',right);
  fig1.style.left=`calc(${x}% - ${(fig1.offsetWidth||80)/2}px)`; $('floor').style.setProperty('--sx',((x+60)/220*100)+'%');
  bow1={t0:AC.currentTime,d,dir:(woke.size%2?1:-1)};
  clearTimeout(b._t); b._t=setTimeout(()=>{ if(litCell===b){ b.classList.replace('on','seen'); litCell=null; } },d*1000+200);
  $('capMeta').textContent=`깨운 칸 ${woke.size} / 56`;
}
grid.addEventListener('pointerdown',e=>{ if(e.button>0) return; wakeCell(e); });
grid.addEventListener('click',e=>{ if(e.detail===0) wakeCell(e); });

/* ---------- 02 흐름 ---------- */
const cv=$('paint'), cx=cv.getContext('2d'), tc=$('tooth'), fig2=$('fig2');
let W2=0,H2=0,DPR=1, strokes=[], car={x:0,y:0,th:0,curv:.03,load:1,px:null,py:null}, lastMove=-1e9, lastT=0, onsetI=0, latDone=0, redDone=0, ended=false;
function size2(){
  const r=$('stage').getBoundingClientRect(); DPR=Math.min(2,devicePixelRatio||1);
  W2=r.width; H2=r.height;
  for(const c of [cv,tc]){ c.width=Math.round(W2*DPR); c.height=Math.round(H2*DPR); }
  cx.setTransform(DPR,0,0,DPR,0,0);
  const t=tc.getContext('2d'), id=t.createImageData(tc.width,tc.height), d=id.data;
  for(let i=0;i<d.length;i+=4){ const v=Math.random(); const a=v<.18?110:v<.45?40:0; d[i]=d[i+1]=d[i+2]=0; d[i+3]=a; }
  t.putImageData(id,0,0);
}
function prep2(){
  seed=23; strokes=[]; let prev=null; const segs=S.c2.segs, n=segs.length;
  const top=14, gap=(H2-2*top)/n;
  segs.forEach((s,k)=>{
    let c=k===0?'dred':pickC(s[2],s[3]); if(c===prev) c=NEIGH[c]; prev=c;
    const T=gap*(1.25+1.3*s[3]), nb=Math.min(70,Math.round(T/1.6)+6), base=P[c];
    const slot=k===0?0:Math.ceil(k/2)*(k%2?1:-1);
    const L=[]; for(let b=0;b<nb;b++){ const sh=.8+rnd()*.3; let col=base.map(v=>Math.min(255,v*sh));
      if(rnd()<.07) col=(c==='white'||c==='yellow')?P.black:P.white;
      L.push({o:rnd()-.5,a:.55+rnd()*.45,w:1.4+rnd()*2.4,ph:rnd()*999,col}); }
    L.sort((a,b)=>a.o-b.o);
    strokes.push({t0:s[0],t1:s[1],m:s[2],yc:H2/2+slot*gap,T,L,dir:k%2?-1:1,done:0,ld:null});
  });
}
const sAt=(arr,t)=>{const i=Math.min(arr.length-1,Math.max(0,Math.round(t*S.c2.fps))); return arr[i];};
function drawStroke(st,t){
  const p=Math.min(1,Math.max(0,(t-st.t0)/(st.t1-st.t0))); if(p<=st.done) return;
  const span=W2+40, xa=st.dir>0?-20+st.done*span:W2+20-st.done*span, xb=st.dir>0?-20+p*span:W2+20-p*span;
  st.done=p; const lo=Math.min(xa,xb), hi=Math.max(xa,xb);
  const dev1=Math.max(-6,Math.min(6,sAt(S.c2.midi,t)-st.m))*2.4, dev0=st.ld??dev1; st.ld=dev1;
  const press=.75+.35*sAt(S.c2.env,t), CH=5;
  for(const b of st.L){
    const y0=st.yc+b.o*st.T*press; cx.lineWidth=b.w;
    for(let x=Math.floor(lo/CH)*CH;x<hi;x+=CH){
      const qa=Math.max(x,lo), qb=Math.min(x+CH,hi); const nz=vnoise(x/(30+st.T*.8),b.ph);
      const al=b.a*Math.max(0,Math.min(1,(nz-.12)*1.9))*(.6+.4*(1-Math.abs(b.o)*.9)); if(al<.05) continue;
      const fa=Math.abs(qa-xa)/(hi-lo||1), fb=Math.abs(qb-xa)/(hi-lo||1), j=(nz-.5)*1.2;
      cx.strokeStyle=rgba(b.col,al); cx.beginPath(); cx.moveTo(qa,y0+j+dev0+(dev1-dev0)*fa); cx.lineTo(qb,y0+j+dev0+(dev1-dev0)*fb); cx.stroke();
    }
  }
}
const WK=Array.from({length:11},(_,k)=>({o:hash(k*3.1)-.5,a:.25+hash(k*7.7)*.75,w:.9+hash(k*1.3)*2}));
function wheelTo(nx,ny,e){
  const dx=nx-car.x, dy=ny-car.y, d=Math.hypot(dx,dy); if(d<.5) return;
  const px=-dy/d, py=dx/d, w=(4+24*e)*(.35+.65*car.load);
  for(const b of WK){ cx.strokeStyle=rgba(P.white,b.a*(.12+.88*car.load)); cx.lineWidth=b.w; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(car.x+px*b.o*w,car.y+py*b.o*w); cx.lineTo(nx+px*b.o*w,ny+py*b.o*w); cx.stroke(); }
  cx.lineCap='butt'; car.th=Math.atan2(dy,dx); car.x=nx; car.y=ny;
  car.load=Math.max(0,car.load-d*.0011*(1+e));
}
function splat(e){
  car.load=Math.min(1,car.load+.6); const cols=[P.white,P.white,P.yellow,P.red,P.black];
  for(let i=0;i<8+e*16;i++){ const ang=car.th+(rnd()-.5)*2.4, dist=8+rnd()*rnd()*70, r=.8+rnd()*rnd()*5;
    cx.fillStyle=rgba(cols[Math.floor(rnd()*cols.length)],.6+rnd()*.4); cx.beginPath(); cx.arc(car.x+Math.cos(ang)*dist,car.y+Math.sin(ang)*dist,r,0,7); cx.fill(); }
}
function lattice(t){
  const L=[[-.06,-.05,.78,1.05],[.22,1.05,1.06,.04],[-.06,.7,.62,-.05],[.47,-.05,1.06,.8],[-.06,.28,.36,1.05]];
  L.forEach((l,j)=>{ const s=Math.min(1,Math.max(0,(t-124-j*1.6)/1.4)); if(s<=0) return;
    cx.strokeStyle='rgba(10,9,12,.96)'; cx.lineWidth=Math.max(10,W2*.012); cx.beginPath();
    cx.moveTo(l[0]*W2,l[1]*H2); cx.lineTo((l[0]+(l[2]-l[0])*s)*W2,(l[1]+(l[3]-l[1])*s)*H2); cx.stroke(); });
}
function redBand(t){
  const s=Math.min(1,Math.max(0,(t-149)/8)); if(s<=redDone) return; const e=u=>u*u*(3-2*u);
  const xa=e(redDone)*W2, xb=e(s)*W2; redDone=s; const h=Math.max(22,H2*.055);
  for(let b=0;b<40;b++){ const y=H2/2+(b/39-.5)*h; cx.lineWidth=h/34;
    for(let x=xa;x<xb;x+=5){ const nz=vnoise(x/70,b*13.7); cx.strokeStyle=rgba(P.red,(b>2&&b<37)?.72+.28*nz:.6*Math.max(0,(nz-.25)*2)); cx.beginPath(); cx.moveTo(x,y); cx.lineTo(Math.min(x+5,xb),y); cx.stroke(); } }
}
function start2(){
  size2(); cx.fillStyle='#0d0b0f'; cx.fillRect(0,0,W2,H2); prep2();
  car={x:W2*.3,y:H2*.5,th:-.2,curv:.03,load:1}; onsetI=0; latDone=0; redDone=0; ended=false; lastT=0; $('end2').hidden=true;
  playStream(bufs.c2,0);
}
const s2=$('s2'), floor2=$('floor2'), V={th:0,s:1,d:900,px:0,py:0};
function proj(x,y){ const ox=W2/2, oy=H2*.6, Y=y-oy, X=x-ox, c=Math.cos(V.th), sn=Math.sin(V.th);
  const Z=V.s*Y*sn, k=V.d/(V.d-Z); return {x:V.px+(ox+V.s*X-V.px)*k, y:V.py+(oy+V.s*Y*c-V.py)*k, k:k*V.s}; }
function unproj(sx,sy){ const ox=W2/2, oy=H2*.6, c=Math.cos(V.th), sn=Math.sin(V.th), A=sy-V.py, B=oy-V.py;
  const Y=(A-B)*V.d/(V.s*(V.d*c+A*sn)), k=V.d/(V.d-V.s*Y*sn), X=((sx-V.px)/k-(ox-V.px))/V.s; return {x:ox+X,y:oy+Y}; }
s2.addEventListener('pointermove',e=>{ if(scene!==2||!stream) return; const r=s2.getBoundingClientRect();
  const p=unproj(e.clientX-r.left,e.clientY-r.top); if(p.x<-40||p.x>W2+40||p.y<-40||p.y>H2+40) return;
  if(performance.now()-lastMove>400){car.x=p.x;car.y=p.y;} lastMove=performance.now();
  wheelTo(p.x,p.y,sAt(S.c2.env,streamT())); });
s2.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; s2.setPointerCapture?.(e.pointerId); lastMove=-1e9; });
s2.style.touchAction='none';
function camera2(t){ const ez=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
  let th = 52*ez((t-6)/34) * (1-ez((t-148)/14));
  if(!RM) th+= (th>4? look.y*5 : 0); if(RM) th=0;
  V.th=th*Math.PI/180; V.s=1+.24*Math.min(1,th/52); V.px=W2*(.5+(RM?0:look.x*.14)); V.py=H2*.4;
  s2.style.perspective=V.d+'px'; s2.style.perspectiveOrigin=`${V.px}px ${V.py}px`;
  floor2.style.transform=`scale(${V.s}) rotateX(${th}deg)`; }
function tick2(){
  if(!stream) return; const t=streamT();
  for(const st of strokes) if(t>=st.t0-.05&&st.done<1&&t<=st.t1+.3) drawStroke(st,Math.min(t,st.t1));
  const e=sAt(S.c2.env,t);
  if(t>2.5&&t<121){
    if(performance.now()-lastMove>2500){ // the car drives itself when nobody steers
      const ext=Math.max(H2*.16,Math.abs(strokes.reduce((m,s)=>s.done>0?Math.max(m,Math.abs(s.yc-H2/2)):m,0)));
      const dmid=sAt(S.c2.midi,t)-sAt(S.c2.midi,Math.max(0,t-.05)); car.curv*=.993;
      let steer=car.curv+.04*Math.max(-2,Math.min(2,dmid)); const ddx=W2/2-car.x, ddy=H2/2-car.y, d=Math.hypot(ddx/(W2*.46),ddy/ext);
      if(d>.62){ const want=Math.atan2(ddy,ddx); steer+=(((want-car.th+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*.09*Math.min(1.5,(d-.62)/.38); }
      const th=car.th+steer, v=(2+9*e)*(W2/1200+.4);
      wheelTo(car.x+Math.cos(th)*v,car.y+Math.sin(th)*v,e); car.th=th;
    }
    while(onsetI<S.c2.onsets.length&&S.c2.onsets[onsetI]<=t){ if(t-S.c2.onsets[onsetI]<.2){ splat(Math.min(1,e)); if(rnd()<.5) car.curv=(.03+rnd()*.05)*(rnd()<.5?-1:1);} onsetI++; }
  }
  if(t>=124) lattice(t); if(t>=149) redBand(t);
  camera2(t);
  const rw=fig2.offsetWidth||64, rh=fig2.offsetHeight||45, show=t>2.5&&t<121, fl=Math.cos(car.th)>0, q=proj(car.x,car.y);
  fig2.style.opacity=show?1:0; fig2.style.transition='opacity 1.2s';
  fig2.style.transform=`translate(${q.x-rw/2}px,${q.y-rh*.8}px) scale(${(q.k*(fl?-1:1)).toFixed(3)},${q.k.toFixed(3)}) rotate(${Math.max(-12,Math.min(12,Math.sin(car.th)*12*(fl?-1:1)))}deg) translateY(${-Math.abs(Math.sin(performance.now()/90))*4*e}px)`;
  const left=Math.max(0,Math.round(stream.dur-t)); $('capMeta').textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')} / 2:49 · 활 ${strokes.filter(s=>s.done>0).length} / ${strokes.length}`;
  if(stream.done&&!ended){ ended=true; $('end2').hidden=false; }
}
$('again2').onclick=()=>start2();

/* ---------- 03 항해 ---------- */
const GOAL=1000, wake=$('wake'), wx=wake.getContext('2d'), fig3=$('fig3'), voy=$('voy');
let mine=0, total=0, people=0, segI=0, wakes=[], dbRef=null, uid=null, canWrite=true, pending=null, others=0, finale=false, peek=false, fin0=0;
const solo=document.createElement('img'); solo.className='player solo'; solo.src='f_cello.webp'; solo.alt='오케스트라 앞에서 첼로를 켜는 김종훈 피규어'; $('midL').appendChild(solo); const cam=$('cam'); let dolly=0;
const orch=$('orch'), ox=orch.getContext('2d');
function size3(){ const r=voy.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); for(const [c,x] of [[wake,wx],[orch,ox]]){ c.width=r.width*d; c.height=r.height*d; x.setTransform(d,0,0,d,0,0);} }
function render3(){
  const all=Math.max(total,others+mine), p=peek?1:Math.min(1,all/GOAL);
  voy.style.setProperty('--lit',(.35+.65*p).toFixed(3));
  if(p>=1&&!finale&&scene===3) startFinale(); 
  $('bar').style.width=(p*100)+'%';
  $('capMeta').textContent=`함께 저은 노 ${all.toLocaleString('ko-KR')}번 / ${GOAL.toLocaleString('ko-KR')} · 나 ${mine}번`+(people?` · ${people}명`:'');
  $('row').textContent= finale ? '공연 다시 듣기' : '노 젓기';
  $('peek').textContent= peek ? '항해로 돌아가기' : '도착 장면 미리 보기';
  $('capText').textContent= p>=1 ? (peek&&all<GOAL?'미리 보기 · ':'')+'1,000번의 노로 오페라하우스에 닿았습니다. 김종훈이 오케스트라와 함께 첼로를 연주합니다.'
    : (dbRef? '노를 저을 때마다 첼로가 한 번 활을 긋습니다. 모든 관람객의 노가 함께 쌓입니다.' : '노를 저을 때마다 첼로가 한 번 활을 긋습니다. (이 화면에서는 혼자 젓는 기록만 남습니다)');
}
function startFinale(){ if(!bufs.c2){ needC2().then(ok=>{ if(ok&&scene===3) startFinale(); }); return; } finale=true; fin0=performance.now(); voy.classList.add('finale'); if(oneShot){try{oneShot.s.stop();}catch(e){}} playStream(bufs.c2,0); }
function endFinale(){ finale=false; voy.classList.remove('finale'); stopStream(); }
function row(){
  if(!S) return; wakeAudio(); if(!bufs.c2){ needC2(); return; } if(finale){ fin0=performance.now(); playStream(bufs.c2,0); return; } const s=S.c2.segs[segI%S.c2.segs.length]; segI++;
  playSeg(bufs.c2,s[0],s[1],.6); mine++;
  fig3.classList.remove('row'); void fig3.offsetWidth; fig3.classList.add('row');
  const r=voy.getBoundingClientRect(); const cols=[P.white,P.orange,P.sky,P.white];
  for(let k=0;k<3;k++) wakes.push({x:r.width*(.33+rnd()*.05),y:r.height*(.66+rnd()*.24),v:.6+rnd()*1.2+s[3],len:30+rnd()*90,life:1,c:cols[Math.floor(rnd()*4)]});
  render3(); save();
}
function save(){ if(!dbRef||!canWrite) return; clearTimeout(pending); pending=setTimeout(async()=>{
  try{ await dbRef.doc('voyage/'+uid).set({strokes:mine,at:Date.now()}); }catch(e){ canWrite=false; render3(); } },1200); }
function tick3(){
  const r=voy.getBoundingClientRect(); wx.clearRect(0,0,r.width,r.height);
  const p=Math.min(1,Math.max(total,others+mine)/GOAL), a=amp();
  const g=wx.createRadialGradient(r.width*.52,r.height*.36,0,r.width*.52,r.height*.36,r.width*.32);
  g.addColorStop(0,`rgba(255,236,200,${(.05+.28*p)*(1+a*.8)})`); g.addColorStop(1,'rgba(255,236,200,0)');
  wx.globalCompositeOperation='lighter'; wx.fillStyle=g; wx.fillRect(0,0,r.width,r.height);
  for(const w of wakes){ w.x+=w.v*(RM?0:1); w.life-=.006;
    for(let b=0;b<4;b++){ wx.strokeStyle=rgba(w.c,Math.max(0,w.life)*.5*(1-b*.2)); wx.lineWidth=1.2; wx.beginPath(); wx.moveTo(w.x-w.len,w.y+b*1.6); wx.lineTo(w.x,w.y+b*1.6); wx.stroke(); } }
  wakes=wakes.filter(w=>w.life>0&&w.x-w.len<r.width); wx.globalCompositeOperation='source-over';
  ox.clearRect(0,0,r.width,r.height);
  dolly+=((finale?1:0)-dolly)*.012;
  const dz=dolly*dolly*(3-2*dolly);
  voy.style.perspectiveOrigin=`${50+dz*2}% ${50-dz*14}%`;
  cam.style.transform=RM?'':`translateZ(${dz*150}px) rotateY(${look.x*5*(1-dz*.5)}deg) rotateX(${-look.y*3}deg)`;
  if(finale){
    const t=stream?streamT():0, k=Math.min(1,(performance.now()-fin0)/2600);
    drawOrchestra(ox,r.width,r.height,t,a,k);
    let bw=0; const sg=S.c2.segs; for(let i=0;i<sg.length;i++){ if(t>=sg[i][0]&&t<sg[i][1]){ const q=(t-sg[i][0])/(sg[i][1]-sg[i][0]); bw=(i%2?1:-1)*(2*q-1); break; } }
    solo.style.setProperty('--bw',bw.toFixed(3));
    if(stream&&stream.done&&!RM){ /* hold the last chord; viewer can replay */ }
  }
}

// an orchestra of 김종훈 figures on the forecourt; the back row stays in shadow
const OI={}, OD={};
for(const [k,f] of [['vn','f_violin'],['fl','f_flute'],['vc','f_cello'],['cd','f_conductor_back']]){
  const im=new Image(); im.src=''+f+'.webp'; OI[k]=im;
  im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; const x=c.getContext('2d');
    x.drawImage(im,0,0); x.globalCompositeOperation='source-atop'; x.fillStyle='rgba(12,10,16,.8)'; x.fillRect(0,0,c.width,c.height); OD[k]=c; };
}
function drawOrchestra(c,W,H,t,a,k){
  const base=H*.605, u=H*.24;
  const seats=[
    [.24,.78,'vn',1],[.32,.8,'fl',1],[.40,.82,'vc',1],[.60,.82,'vc',-1],[.68,.8,'vn',-1],[.76,.78,'fl',-1],
    [.20,.94,'vc',1],[.29,.97,'vn',1],[.38,1,'fl',1],[.62,1,'vn',-1],[.71,.97,'fl',-1],[.80,.94,'vc',-1]];
  c.save(); c.globalAlpha=k;
  const g=c.createRadialGradient(W*.5,base,0,W*.5,base,W*.36); g.addColorStop(0,'rgba(255,214,150,.30)'); g.addColorStop(1,'rgba(255,214,150,0)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  const put=(img,X,Y,h,flip,rot)=>{ if(!img||!(img.width)) return; const w=h*img.width/img.height;
    c.save(); c.translate(X,Y); c.rotate(rot); c.scale(flip,1); c.drawImage(img,-w/2,-h,w,h); c.restore(); };
  // conductor, seen from behind, in the middle of the back row
  const beat=Math.sin(t*Math.PI*1.6)*(.5+a);
  put(OD.cd||OI.cd, W*.5, base-H*.1, u*.86, 1, beat*.05);
  seats.slice().sort((p,q)=>p[1]-q[1]).forEach(([x,d,kind,f],i)=>{
    const h=u*d, back=d<.85, Y=base-(1-d)*H*.42, bob=Math.sin(t*2.4+i*1.7)*(.4+a*1.6)*h*.015, rot=Math.sin(t*2+i*1.3)*(.5+a)*.035;
    put(back?(OD[kind]||OI[kind]):OI[kind], W*x, Y+bob, h, f, rot);
  });
  c.restore();
}
$('row').onclick=row;
$('peek').onclick=()=>{ peek=!peek; if(peek) startFinale(); else endFinale(); render3(); };
voy.addEventListener('click',e=>{ if(e.target.closest('button')) return; row(); });
addEventListener('keydown',e=>{ if(scene===3&&e.code==='Space'&&!e.target.closest('button')){ e.preventDefault(); row(); } });

async function connect(){
  if(!window.claude?.use) return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    $('peek').hidden=!(user&&(user.isOwner()||user.canEdit()));
    if(!db||!user) return; uid=await user.id(); if(!uid) return; dbRef=db;
    db.collection('voyage').onSnapshot(snap=>{
      let t=0,n=0,o=0; for(const d of snap.docs){ const v=+(d.data()?.strokes)||0; t+=v; n++; if(d.id!==uid) o+=v; else mine=Math.max(mine,v); }
      others=o; total=o+mine; people=n; render3();
    },()=>{});
    render3();
  }catch(e){}
}

/* ---------- chapters ---------- */
const caps={1:'칸을 눌러 보세요. 칸마다 첼로의 낮은 소리가 하나씩 들어 있습니다.',2:'첼로의 활 한 번이 띠 하나가 됩니다. 화면을 문지르면 바퀴가 그 위를 달립니다.'};
function go(n){
  scene=n; for(const k of [1,2,3]){ $('s'+k).hidden=k!==n; $('nav'+k).setAttribute('aria-current',k===n?'true':'false'); }
  stopStream(); if(oneShot){ try{oneShot.s.stop();}catch(e){} }
  if(n===1){ $('capText').textContent=caps[1]; $('capMeta').textContent=`깨운 칸 ${woke.size} / 56`; }
  if(n===2){ $('capText').textContent=caps[2]; if(S) needC2().then(ok=>{ if(ok&&scene===2) start2(); }); }
  if(n!==3&&finale){ voy.classList.remove('finale'); finale=false; }
  if(n===3){ size3(); render3(); }
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(+b.dataset.s));
addEventListener('resize',()=>{ if(scene===3) size3(); const r=$('stage').getBoundingClientRect(); if(scene===2&&stream&&Math.abs(r.width-W2)>40){ size2(); cx.fillStyle='#0d0b0f'; cx.fillRect(0,0,W2,H2); prep2(); playStream(bufs.c2,0); } });

function loop(){
  stepLook();
  if(scene===1){ $('paper').style.transform=RM?'':`rotateY(${look.x*9}deg) rotateX(${-look.y*5}deg)`; if(litCell) litCell.style.setProperty('--amp',amp().toFixed(3));
    let bw=0; if(bow1&&AC){ const q=(AC.currentTime-bow1.t0)/bow1.d; if(q<1) bw=bow1.dir*(2*Math.min(1,q)-1)*Math.min(1,q*6); else bow1=null; } fig1.style.setProperty('--bw',bw.toFixed(3)); }
  if(scene===2) tick2(); if(scene===3) tick3();
  requestAnimationFrame(loop);
}
$('start').onclick=async()=>{
  $('start').disabled=true; if(!AC) openAudio();
  try{ await loadAll(); wakeAudio(); $('intro').hidden=true; if(!window.claude?.use) $('peek').hidden=false; go(scene); loop(); connect(); }
  catch(e){ $('load').textContent='소리를 불러오지 못했습니다. 페이지를 새로 고친 뒤 다시 눌러 주세요.'; $('start').disabled=false; }
};
})();
</script>
